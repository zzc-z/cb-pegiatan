pipeline:
  build:
    image: node:18
    commands:
    - npm install
    - npm run build
    - mv dist/* .

  push:
    image: appleboy/drone-git-push
    settings:
      branch: pages
      remote: git@codeberg.org:Linerly/pegiatan.git
      force: true
      commit: true
      commit_message: "Woodpecker build ${CI_COMMIT_SHA:0:7} [CI SKIP]"
      author_name: "Codeberg CI"
      author_email: ""
      ssh_key:
        from_secret: ssh_key